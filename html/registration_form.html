<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nayan Malviya - CEX (Complete Entertainment Exchange)</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <header>
        <div>
            <div>
                <i class="fa-solid fa-bars-staggered"></i>
                Menu
            </div>
            <img src="https://uk.webuy.com/img/logo.svg" alt="CEX" class="mx-3 h-12" />
            <input type="search" placeholder="What you want to buy?">

            <div>
                <i class="fa-regular fa-user"></i>
                <span>Account</span>
            </div>
            <div>
                <i class="fa-solid fa-bag-shopping"></i>
                <span>
                    Basket
                </span>
            </div>

            <button class="cx-sell-btn">
                Sell to CEX
            </button>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="registration_form.html" class="link-active">register</a>
        </nav>
    </header>

   


    <main>
        <h3 class="cxbreadcrub">Home > <strong>My Account</strong></h3>

        <section class="cx-main-section">
            <h2 class="main-section-heading">Your Profile</h2>

            <section class="sub-section-cont">
                <div class="sub-section-heading">
                    <h3 class="font-bold text-xl">Personal Information</h3>
                    <button class="font-bold text-white bg-black px-2 rounded-xl">
                        Edit
                    </button>
                </div>


                <div class="sub-section-main-cont">
                    <div>
                        <span class="cx-semi-bold">First Name</span>
                        <span>Nayan</span>
                    </div>
                    <div class="flex flex-col gap-1 ">
                        <span class="cx-semi-bold">Last Name</span>
                        <span>Malviya</span>
                    </div>
                </div>

            </section>


            <section class="sub-section-cont">
                <div class="sub-section-heading">
                    <h3 class="font-bold text-xl">Email Address</h3>
                    <button class="font-bold text-white bg-black px-2 rounded-xl">
                        Edit
                    </button>
                </div>


                <div class="sub-section-main-cont">
                    <div>
                        <span class="cx-semi-bold">Email</span>
                        <span>nayanmalviya75@gmail.com</span>
                    </div>

                </div>

            </section>

            <section class="sub-section-cont">
                <div class="sub-section-heading">
                    <h3 class="font-bold text-xl">Contact Number</h3>
                    <button class="font-bold text-white bg-black px-2 rounded-xl">
                        Edit
                    </button>
                </div>


            </section>




            <section class="sub-section-cont">
                <div class="sub-section-heading">
                    <h3 class="font-bold text-xl">Password</h3>
                </div>


                <div class="sub-section-main-cont">
                    <div>
                        <span class="cx-semi-bold cx-underline">Reset password</span>
                    </div>

                </div>

            </section>


        </section>
    </main>

    <footer>
        © All site contents copyright 1999-2026, CeX Ltd. All trademarks acknowledged. E&OE.
    </footer>
</body>

</html>
