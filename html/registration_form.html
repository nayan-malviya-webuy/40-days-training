<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nayan Malviya - CEX (Complete Entertainment Exchange)</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <header>
        <div>
            <div>
                <i class="fa-solid fa-bars-staggered"></i>
                Menu
            </div>
            <img src="https://uk.webuy.com/img/logo.svg" alt="CEX" class="mx-3 h-12" />
            <input type="search" placeholder="What you want to buy?">

            <div>
                <i class="fa-regular fa-user"></i>
                <span>Account</span>
            </div>
            <div>
                <i class="fa-solid fa-bag-shopping"></i>
                <span>
                    Basket
                </span>
            </div>

            <button class="cx-sell-btn">
                Sell to CEX
            </button>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="registration_form.html" class="link-active">register</a>
        </nav>
    </header>

   


    <main style="margin-left: 60px;">

        <h3 class="cxbreadcrub">Home > <strong class="cx-semi-bold">register account</strong></h3>

        <section class="cx-main-section">
            <h3 class="main-section-heading">Complete HTML Form</h3>

            <!-- method should be post... but I used get bcs I wanna show another html page on submission -->
            <form action="register.html" method="get" class="cx-form">

                <h4 class="cx-form-heading">Complete your address below</h4>
                <section class="cx-form-section">

                    <div class="cx-form-field">
                        <label for="name">Name :</label>
                        <input type="text" name="name" id="name" placeholder="Enter Your Name"
                            class="border rounded ps-2 w-[80%] mt-1" minlength="3" maxlength="35"
                            pattern="[A-Za-z ]{3,35}" required>
                    </div>

                    <div class="cx-form-field">
                        <label for="email">Email :</label>
                        <input type="email" name="email" id="email" placeholder="Enter Your Email"
                            class="border rounded ps-2 w-[80%] mt-1" required>
                    </div>

                    <div class="cx-form-field">
                        <label for="password">Password :</label>
                        <input type="password" name="password" id="password" placeholder="Enter Your Password"
                            class="border rounded ps-2 w-[80%] mt-1"
                            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                            title="Minimum 8 characters with uppercase, lowercase, number and special character"
                            required>
                    </div>

                    <div class="cx-form-field">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" name="phone" id="phone" placeholder="Enter Your Phone Number"
                            class="border rounded ps-2 w-[80%] mt-1" pattern="[6-9][0-9]{9}" maxlength="10"
                            title="Enter a valid 10-digit Indian mobile number" required>
                    </div>

                    <div class="cx-form-field">
                        <label for="website">Website URL:</label>
                        <input type="url" name="web-url" id="website" placeholder="Enter Your Website URL"
                            class="border rounded ps-2 w-[80%] mt-1" required>
                    </div>

                    <div class="cx-form-field">
                        <label for="age">Age:</label>
                        <input type="number" name="age" id="age" placeholder="Enter Your Age"
                            class="border rounded ps-2 w-[80%] mt-1" min="18" max="120" required>
                    </div>

                </section>


                <h4 class="cx-form-heading" style="margin-top: 30px;">Additional Fields</h4>
                <section class="cx-form-section">

                    <div class="cx-form-field">
                        <label>Gender:</label>

                        <div>
                            <div>
                                <input type="radio" name="gender" id="male" value="Male" required>
                                <label for="male">Male</label>
                            </div>

                            <div>
                                <input type="radio" name="gender" id="female" value="Female">
                                <label for="female">Female</label>

                            </div>

                            <div>
                                <input type="radio" name="gender" id="other" value="other">
                                <label for="other">Other</label>
                            </div>
                        </div>
                    </div>


                    <div class="cx-form-field">
                        <label>Skills:</label>

                        <div class="flex gap-2">
                            <div>
                                <input type="checkbox" name="skills" id="html" value="HTML">
                                <label for="html">HTML</label>
                            </div>

                            <div>
                                <input type="checkbox" name="skills" id="css" value="CSS">
                                <label for="css">CSS</label>
                            </div>

                            <div>
                                <input type="checkbox" name="skills" id="js" value="JavaScript">
                                <label for="js">JavaScript</label>
                            </div>
                        </div>
                    </div>

                    <div class="cx-form-field">
                        <label for="country">Country:</label>
                        <select name="country" id="country" class="border rounded border-gray-300 p-1" required>
                            <option value="">Select Country</option>
                        </select>
                    </div>

                    <div class="cx-form-field">
                        <label for="dob">Date Of Birth :</label>
                        <input type="date" name="dob" id="dob" placeholder="Enter Your DOB"
                            class="border rounded ps-2 w-[80%] mt-1" max="2008-11-11" min="1900-01-01" required>
                    </div>

                    <div class="cx-form-field">
                        <label for="name">Time Of Birth :</label>
                        <input type="time" name="tob" id="tob" placeholder="Enter Your TOB"
                            class="border rounded ps-2 w-[80%] mt-1" required>
                    </div>

                    <div class="cx-form-field">
                        <label for="dnt">Date and Time :</label>
                        <input type="datetime-local" name="dnt" id="dnt" placeholder="Enter Your Date and Time"
                            class="border rounded ps-2 w-[80%] mt-1" min="1900-01-01T00:00" required>
                    </div>

                </section>


                <h4 class="cx-form-heading">Some More</h4>
                <section class="cx-form-section">

                    <!-- Text Field -->
                    <div class="cx-form-field">
                        <label for="bio">About Yourself:</label>
                        <textarea name="bio" id="bio" placeholder="Enter something about yourself"
                            class="border rounded ps-2 w-[80%] mt-1" maxlength="300"></textarea>
                    </div>

                    <!-- Range -->
                    <div class="cx-form-field">
                        <label for="experience">Experience (Years):</label>
                        <input type="range" name="experience" id="experience" min="0" max="10" value="5"
                            class="w-[80%] mt-2">
                    </div>

                    <!-- Color -->
                    <div class="cx-form-field">
                        <label for="color">Choose Your Favorite Color:</label>
                        <input type="color" name="color" id="color" class="w-[80%] mt-1">
                    </div>

                    <!-- File -->
                    <div class="cx-form-field">
                        <label for="resume">Upload Resume:</label>
                        <input type="file" name="resume" id="resume" class="w-[80%] mt-1 border p-1 rounded-sm"
                            accept=".pdf">
                    </div>

                </section>


                <div class="mt-10 flex justify-between items-center">
                    <input type="reset" value="reset"
                        class="mx-auto border bg-black-200 py-1 px-3 rounded-xl shadow cursor-pointer">
                    <input type="submit" value="Register"
                        class="mx-auto border bg-black-200 py-1 px-3 rounded-xl shadow cursor-pointer">
                </div>
            </form>
        </section>
    </main>

    <footer>
        © All site contents copyright 1999-2026, CeX Ltd. All trademarks acknowledged. E&OE.
    </footer>
</body>

</html>
