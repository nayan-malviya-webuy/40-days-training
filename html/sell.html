<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nayan Malviya - CEX (Complete Entertainment Exchange)</title>
    <link rel="stylesheet" href="public/styles/style.css">

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="public/styles/home_page.css">
</head>

<body>

    <span id="header-container">
    </span>

    <!-- this is the main section -->
    <main class="cx-home-main-container">

        <!-- hot products section -->
        <section class="cx-home-section">
            <h2 class="cx-section-heading">Recently Viewed</h2>

            <div class="section-products-box slide-product-cont" id="cx-recommended-boxid">

            </div>

        </section>

    </main>


    <footer class="cx-main-footer" id="footer-container"></footer>



    <script type="module">
        import { loadComponent, initHeader } from "./public/js/main.js";
        import { initSearch } from "./public/js/search.js";
        import { fetchAndRender, fetchAndRenderCats } from "./public/js/home.js";
        import { initAuth } from "./public/js/auth.js";


        Promise.all([
            loadComponent("header-container", "components/sellCxHeader.html"),
            loadComponent("footer-container", "components/footer.html")
        ]).then(() => {
            initHeader(false);
            initAuth()

            fetchAndRenderCats("cx-sell-cat-container")
        });


        fetchAndRender("cx-recommended-boxid", "products?limit=7&skip=0");

    </script>
</body>

</html>
