<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nayan Malviya - CEX (Complete Entertainment Exchange)</title>
    <link rel="stylesheet" href="public/styles/style.css">

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="public/styles/home_page.css">

    <style>
        .cx-sell-category-card h3 {
            color: var(--tertiary);
        }
    </style>
</head>

<body>

    <span id="header-container">

    </span>

    <!-- this is the main section -->
    <main class="cx-home-main-container">

    </main>


    <footer class="cx-main-footer" id="footer-container"></footer>



    <script type="module">
        import { loadComponent, initHeader } from "./public/js/main.js";
        import { initSearch } from "./public/js/search.js";
        import { fetchAndRender, fetchAndRenderCats } from "./public/js/home.js";
        import { initAuth } from "./public/js/auth.js";
        import { getCategoryPageBanner, CatPageSection, catPageCategoriesSec } from "./public/js/utils.js";
        import { config } from "./public/js/config.js";


        Promise.all([
            loadComponent("header-container", "components/header.html"),
            loadComponent("footer-container", "components/footer.html")
        ]).then(() => {
            initHeader();
            initAuth()
            const searchInput = document.getElementById("cx-middle-search-bar");

            searchInput.addEventListener("keyup", (e) => {
                if (e.keyCode === 13) {
                    window.location.href = '/html/search.html?q=' + searchInput.value
                }
            })
        });

        const params = new URLSearchParams(window.location.search);


        const superCatId = params.get('superCatId');
        const superCatName = params.get('superCatName');

        const mainContainer = document.querySelector('main');
        // console.log(config.pages.)
        const pageDetails = config.pages[superCatId]


        if (pageDetails.content.banner.enable)
            mainContainer.insertAdjacentHTML("beforeend", getCategoryPageBanner(pageDetails.content.banner));

        console.log(pageDetails.content.relatedCats)
        if (pageDetails.content.relatedCats.enable) {
            mainContainer.insertAdjacentHTML("beforeend", catPageCategoriesSec());

            // cx-catpage-cat-section
            // pageDetails.content.relatedCats
            fetchAndRenderCats("cx-catpage-cat-section", pageDetails.content.relatedCats.endpoint)
        }

        pageDetails.content.sections.filter(sec => sec.enable).forEach((section, index) => {

            if (section.enable) mainContainer.insertAdjacentHTML("beforeend", CatPageSection(section, index));
            fetchAndRender(`cat-sec-${index}`, section.endpoint)
        });

    </script>
</body>

</html>
