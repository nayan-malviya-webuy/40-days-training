<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nayan Malviya - CEX (Complete Entertainment Exchange)</title>
    <link rel="stylesheet" href="public/styles/style.css">

    <!-- Font Awesome CDN Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>

<body>

    <span id="header-container">
</span>


    <main>
        <h3 class="cxbreadcrub">Home > <strong>My Account</strong></h3>

        <div class="cx-main-container">
            <aside class="cx-left-profile-nav-section">
                <h2>Hi Nayan</h2>
                <div class="cx-lp-ac-box">
                    <strong>Account Number:</strong>
                    <span>9029 0212 7737 7089 88</span>
                </div>

                <div class="cx-left-panel-blinks-cont">
                    <button class="cx-left-panel-blinks-btns">
                        <i class="fa-solid fa-cube"></i>
                        Your Purchase
                    </button>

                    <button class="cx-left-panel-blinks-btns">
                        <i class="fa-solid fa-tag"></i>
                        Your Sales
                    </button>

                    <button class="cx-left-panel-blinks-btns">
                        <i class="fa-regular fa-heart"></i>
                        Favourits
                    </button>

                    <button class="cx-left-panel-blinks-btns">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        Recently Viewed
                    </button>
                </div>

                <div class="cx-left-panel-box">
                    <button class="cx-left-panel-box-btn">
                        Your Profile
                    </button>
                    <button class="cx-left-panel-box-btn">
                        Your Address
                    </button>
                </div>


                <div class="cx-left-panel-box">
                    <button class="cx-left-panel-box-btn">
                        Your Membership Card
                    </button>
                    <button class="cx-left-panel-box-btn">
                        Membership Abilities
                    </button>
                    <button class="cx-left-panel-box-btn">
                        Your Alerts
                    </button>
                </div>

                <div class="cx-left-panel-box">
                    <button class="cx-left-panel-box-btn">
                        Message Center
                    </button>
                    <button class="cx-left-panel-box-btn">
                        Your Saved Payment Cards
                    </button>
                    <button class="cx-left-panel-box-btn">
                        Your Bank Details
                    </button>
                    <button class="cx-left-panel-box-btn">
                        Your Paypal Account Details
                    </button>
                    <button class="cx-left-panel-box-btn">
                        Cancel My Account
                    </button>
                    <button class="cx-left-panel-box-btn">
                        Log Out
                    </button>
                </div>
            </aside>


            <section class="cx-main-section">
                <h2 class="main-section-heading">Your Profile</h2>

                <section class="sub-section-cont">
                    <div class="sub-section-heading">
                        <h3 class="font-bold text-xl">Personal Information</h3>
                        <button class="font-bold text-white bg-black px-2 rounded-xl">
                            Edit
                        </button>
                    </div>


                    <div class="sub-section-main-cont">
                        <div>
                            <span class="cx-semi-bold">First Name</span>
                            <span>Nayan</span>
                        </div>
                        <div class="flex flex-col gap-1 ">
                            <span class="cx-semi-bold">Last Name</span>
                            <span>Malviya</span>
                        </div>
                    </div>

                </section>


                <section class="sub-section-cont">
                    <div class="sub-section-heading">
                        <h3 class="font-bold text-xl">Email Address</h3>
                        <button class="font-bold text-white bg-black px-2 rounded-xl">
                            Edit
                        </button>
                    </div>


                    <div class="sub-section-main-cont">
                        <div>
                            <span class="cx-semi-bold">Email</span>
                            <span>nayanmalviya75@gmail.com</span>
                        </div>

                    </div>

                </section>

                <section class="sub-section-cont">
                    <div class="sub-section-heading">
                        <h3 class="font-bold text-xl">Contact Number</h3>
                        <button class="font-bold text-white bg-black px-2 rounded-xl">
                            Edit
                        </button>
                    </div>


                </section>




                <section class="sub-section-cont">
                    <div class="sub-section-heading">
                        <h3 class="font-bold text-xl">Password</h3>
                    </div>


                    <div class="sub-section-main-cont">
                        <div>
                            <span class="cx-semi-bold cx-underline">Reset password</span>
                        </div>

                    </div>

                </section>


            </section>
        </div>
    </main>

    <footer class="cx-main-footer" id="footer-container"></footer>



    <script type="module">
        import { loadComponent, initHeader } from "./public/js/main.js";

        Promise.all([
            loadComponent("header-container", "components/header.html"),
            loadComponent("footer-container", "components/footer.html")
        ]).then(initHeader);
    </script>
</body>

</html>
